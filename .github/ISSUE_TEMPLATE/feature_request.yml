name: Feature request
description: Propose a new capability or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement. For large or behaviour-changing
        ideas, an issue first is the best way to agree on the approach before
        writing code. Please do not include secrets.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Why does it matter?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you prefer this one.
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Expected impact
      description: Who benefits, and how? Any performance, compatibility, or operational impact?
    validations:
      required: false
  - type: textarea
    id: breaking
    attributes:
      label: Breaking-change considerations
      description: Would this change existing behaviour, configuration, or interfaces?
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: This request does not include secrets, tokens, or credentials.
          required: true
        - label: I searched existing issues and did not find a duplicate.
          required: true
